<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>미니 투자 시뮬레이터 - 로그인</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; }
        header {
            background-color: #2b4a6f; color: white;
            padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav a {
            color: white; text-decoration: none; margin: 0 12px; font-weight: bold;
        }
        nav a:hover { text-decoration: underline; }
        .container {
            max-width: 400px; margin: 60px auto; padding: 20px;
            background: white; box-shadow: 0 0 10px #ccc; border-radius: 8px;
        }
        h2 { color: #2b4a6f; margin-bottom: 25px; text-align: center; }
        form {
            display: flex; flex-direction: column;
        }
        label {
            font-weight: bold; margin-bottom: 8px; color: #444;
        }
        input[type="text"], input[type="password"] {
            padding: 10px; margin-bottom: 20px;
            border: 1px solid #ccc; border-radius: 5px;
            font-size: 1rem;
        }
        button {
            padding: 12px; background-color: #2b4a6f; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #3e5a7e;
        }
        .message {
            color: red; margin-bottom: 15px; text-align: center;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 삽입 -->
<div th:replace="fragments/header :: headerFragment"></div>

<div class="container">
    <h2>로그인</h2>

    <div th:if="${param.error}" class="message">아이디 또는 비밀번호가 올바르지 않습니다.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" placeholder="아이디 입력" required />

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력" required />

        <button type="submit">로그인</button>
    </form>
</div>

</body>
</html>
