<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>미니 투자 시뮬레이터 - 주식 리스트</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; }
        header {
            background-color: #2b4a6f; color: white;
            padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav a {
            color: white; text-decoration: none; margin: 0 12px; font-weight: bold;
        }
        nav a:hover { text-decoration: underline; }
        .container {
            max-width: 900px; margin: 40px auto; padding: 0 20px;
        }
        h2 { color: #2b4a6f; margin-bottom: 20px; }
        table {
            width: 100%; border-collapse: collapse; background: white; box-shadow: 0 0 10px #ddd;
        }
        th, td {
            padding: 14px 15px; border-bottom: 1px solid #eee; text-align: left;
        }
        th { background-color: #e6ebf5; }
        button {
            padding: 8px 14px; background-color: #2b4a6f; color: white;
            border: none; border-radius: 5px; cursor: pointer;
            transition: background-color 0.25s ease;
        }
        button:hover {
            background-color: #3e5a7e;
        }
        .user-info {
            margin-top: 15px; font-size: 0.9rem; color: #555;
            text-align: right;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 삽입 -->
<div th:replace="fragments/header :: headerFragment"></div>

<div class="container">
    <h2>투자 가능한 주식 목록</h2>

    <div class="user-info" th:if="${user != null}">
        안녕하세요, <span th:text="${user.name}">조현준</span>님 | 잔액: <span th:text="${user.balance}">100000</span> 포인트
    </div>

    <table>
        <thead>
        <tr>
            <th>종목명</th>
            <th>현재 가격</th>
            <th>매수</th>
            <th>매도</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="stock : ${stocks}">
            <td th:text="${stock.name}">삼성전자</td>
            <td th:text="|${#numbers.formatDecimal(stock.currentPrice, 0, 'COMMA')} 원|"></td>
            <td><button type="button" th:onclick="|buyStock(${stock.id})|">매수</button></td>
            <td><button type="button" th:onclick="|buyStock(${stock.id})|">매도</button></td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function buyStock(stockId) {
        alert("매수 요청: 종목 ID = " + stockId);
        // 실제 프로젝트에서는 AJAX 호출하거나 form 제출 처리
    }

    function sellStock(stockId) {
        alert("매도 요청: 종목 ID = " + stockId);
        // 실제 프로젝트에서는 AJAX 호출하거나 form 제출 처리
    }
</script>

</body>
</html>
